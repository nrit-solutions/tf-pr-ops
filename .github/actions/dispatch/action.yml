name: tf-pr-ops dispatch
description: >-
  The engine's pull_request path: hand the pull request to the consumer's
  ops workflow on the default branch, plan for an open PR and unlock for a
  closed one. Nothing else runs here. This job runs from the PR branch's own
  workflow file, which any writer controls, so it holds no secret, creates no
  check and decides nothing: the ops run resolves the PR from the API,
  creates every check and completes the merge gate (#348).

inputs:
  ops-workflow:
    description: >-
      File name of the caller workflow that runs the ops (reusable) workflow;
      the dispatch target for plan work and unlocks.
    required: false
    default: tf-pr-ops.yml

runs:
  using: composite
  steps:
    # before_sha and trigger_actor are hints for wording and for spotting an
    # apply still running on the previous head (#290); the ops run trusts
    # neither. curl, not gh: a self-hosted runner may not carry gh.
    - name: Dispatch the ops run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        WORKFLOW_FILE: ${{ inputs.ops-workflow }}
        DISPATCH_REF: ${{ github.event.repository.default_branch }}
        ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BEFORE_SHA: ${{ github.event.before }}
        ACTOR: ${{ github.actor }}
      run: |
        if [[ "$ACTION" == closed ]]; then
          inputs=$(printf '{"command":"unlock","pr_number":"%s"}' "$PR_NUMBER")
        else
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::error::fork pull requests are not supported"
            exit 1
          fi
          inputs=$(printf '{"command":"plan","pr_number":"%s","before_sha":"%s","trigger_actor":"%s"}' \
            "$PR_NUMBER" "$BEFORE_SHA" "$ACTOR")
        fi
        curl -sS --fail-with-body --retry 3 -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$API_URL/repos/$REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
          -d "$(printf '{"ref":"%s","inputs":%s}' "$DISPATCH_REF" "$inputs")"
        echo "dispatched $WORKFLOW_FILE at $DISPATCH_REF: $inputs"
