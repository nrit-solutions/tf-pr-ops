name: terraform-pr-ops

# The ops half of the engine: comment commands and dispatched work. The
# pull_request path is the dispatch composite action (.github/actions/dispatch),
# which only dispatches this workflow on the default branch with the PR number;
# that split keeps every native row of this workflow off the PR. Everything
# that decides or writes a check runs here, from the default branch, because
# a pull_request run executes the PR branch's own workflow file (#348).
#   - commenting "/plan" re-plans (optionally "/plan -p <name>")
#   - commenting "/apply" applies (optionally "/apply -p <name>")
#   - commenting "/unlock" force-releases the PR's unit locks; the PR
#     caller dispatches an unlock here automatically on close
#   - commenting "/help" lists the commands
# Each run posts a fresh Digger-style report comment and completes the
# per-project plan/apply checks. /apply respects the repo's required
# reviews, and a "tf-pr-ops / merge-gate" check gates merge until applied
# or no-op.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: plan, apply, or unlock
        type: choice
        options: [plan, apply, unlock]
        default: plan
      project:
        description: project name (blank = all)
        required: false
      # The run resolves the PR from the API; nothing it decides comes from
      # these inputs. A dispatch by hand works like a /plan comment.
      pr_number:
        description: the pull request to plan, apply or unlock
        required: false
      # Hints from the dispatch action, for wording and for spotting an
      # apply still running on the previous head (#290). Never trusted.
      before_sha:
        description: set by the engine on a push; the previous PR head
        required: false
      trigger_actor:
        description: set by the engine on a push; who pushed
        required: false
  # Reusable mode: a consumer repo calls this workflow with `uses:` at a
  # release tag of the public entrypoint repo, and every job installs the
  # runtime of that release (job.workflow_ref).
  workflow_call:
    inputs:
      command:
        description: plan or apply
        type: string
        default: plan
      project:
        description: project name (blank = all)
        type: string
        default: ''
      # Forwarded verbatim by the caller from its own workflow_dispatch
      # inputs (see those inputs above).
      pr_number:
        type: string
        default: ''
      before_sha:
        type: string
        default: ''
      trigger_actor:
        type: string
        default: ''
    secrets:
      INFRACOST_API_KEY:
        required: false
      TFPR_CHECKS_APP_PRIVATE_KEY:
        required: false

# id-token is NOT granted here: the run/apply jobs request it per-job, because a
# tenant that customizes the OIDC subject to require an `environment` claim (as
# nrit-alz-live does) fails any token-capable job that has no environment. resolve
# and gate never log in to Azure, so they must not carry id-token.
permissions:
  contents: read
  pull-requests: write
  checks: write          # the engine-authored check runs, merge gate included

env:
  CONFIG_FILE: projects.yml
  # Used only when the repo has no version manager (mise/asdf). When it does,
  # those pinned versions win (see .github/actions/setup-tools).
  FALLBACK_TERRAFORM_VERSION: "1.9.8"
  FALLBACK_TERRAGRUNT_VERSION: "1.1.2"

jobs:
  resolve:
    # Two early exits, both cheap.
    #
    # A template repository holds no infrastructure and has no bootstrap-created
    # variables or secrets, so plan and apply cannot work there. Skipping keeps its
    # own pull requests green instead of failing every one on the missing
    # variables. A repository generated from a template is not itself a
    # template, so this never skips a customer repo. If the event payload carries
    # no repository object the comparison is false and the job runs, which fails
    # safe.
    #
    # Then: skip comment events that are not a plan/apply command, and comment
    # events from an author with no standing in the repository at all. This is not
    # a write-permission check: MEMBER is any organization member, which under read
    # base permissions includes people with no write access here, and COLLABORATOR
    # covers read and triage collaborators too. It only keeps drive-by outsiders
    # out. author_association exists only on the comment payload, so the test is
    # nested inside the issue_comment branch and the dispatch and workflow_call
    # paths never see it. Rejected commands are answered by the `unauthorized` job
    # below. The commands that change something are then re-checked against the
    # commenter's real repository permission by the Authorize command step; an
    # expression cannot call the API, so that part cannot live here.
    if: >-
      github.event.repository.is_template != true &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/plan') ||
         startsWith(github.event.comment.body, '/apply') ||
         startsWith(github.event.comment.body, '/unlock'))))
    # Discovery and gh calls only; no Azure. Runs on a hosted runner so it never
    # waits on the (constrained, network-scoped) self-hosted runner that run/apply use.
    runs-on: ubuntu-latest
    # For the checks App key, which lives in the environments that only the
    # default branch can use; no id-token, so no Azure identity comes with it.
    environment: ${{ vars.TFPR_PLAN_ENVIRONMENT || 'plan' }}
    outputs:
      # Not steps.parse.outputs.run: the authorize step passes that through, or
      # turns it off when the commenter may not run the command.
      run: ${{ steps.auth.outputs.run }}
      command: ${{ steps.parse.outputs.command }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      # The gate needs this to tell a full run apart from a -p diagnostic.
      project_filter: ${{ steps.parse.outputs.project_filter }}
      # /apply --force: apply even when the plan differs from the reviewed one.
      force: ${{ steps.parse.outputs.force }}
      projects: ${{ steps.ctx.outputs.projects }}
      count: ${{ steps.ctx.outputs.count }}
      tf_changed: ${{ steps.ctx.outputs.tf_changed }}
      # Changed Terraform paths no selected unit accounts for (JSON array);
      # the gate refuses a green verdict while any remain.
      unattributed: ${{ steps.ctx.outputs.unattributed }}
      # A filtered run's unfiltered selection and its unattributed paths; empty
      # on a full run.
      full_projects: ${{ steps.full_select.outputs.projects }}
      full_unattributed: ${{ steps.full_select.outputs.unattributed }}
      # Units on the base branch that this branch deleted. Reported, not blocked;
      # removed_explains_tf tells the gate a zero selection was a removal, or a
      # config-only edit that left the unit inventory unchanged, and not a unit
      # discovery missed.
      removed_units: ${{ steps.ctx.outputs.removed_units }}
      removed_check: ${{ steps.ctx.outputs.removed_check }}
      removed_explains_tf: ${{ steps.ctx.outputs.removed_explains_tf }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      # The run identity stamped on the PR check runs, so completion and both
      # sweeps match what was created.
      check_run_id: ${{ steps.ctx.outputs.check_run_id }}
      check_run_number: ${{ steps.ctx.outputs.check_run_number }}
      approved: ${{ steps.approval.outputs.approved }}
      # The apply job's whole condition, decided by tfpr apply-allowed below.
      apply_allowed: ${{ steps.apply_gate.outputs.apply_allowed }}
      # Where the revocation list in the tfpr-license artifact came from (#350).
      license_list_source: ${{ steps.license.outputs.list_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Reusable mode: install the runtime published with the release that
      # holds this workflow file (job.workflow_ref), from the public
      # entrypoint repo; no token, no private checkout. Vendored mode (the
      # engine repository itself) builds tfpr from its own checkout.
      - name: Install the engine runtime
        if: job.workflow_repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TFPR_RUNTIME_REPO: ${{ job.workflow_repository }}
          TFPR_RUNTIME_REF: ${{ job.workflow_ref }}
          TFPR_RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/install-runtime.sh" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$TFPR_RUNTIME_REPO/contents/install-runtime.sh?ref=$TFPR_RUNTIME_SHA"
          bash "$RUNNER_TEMP/install-runtime.sh"

      - name: Set up Go
        if: job.workflow_repository == github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tfpr
        if: job.workflow_repository == github.repository
        run: |
          go build -o "$RUNNER_TEMP/tfpr" ./cmd/tfpr
          echo "TFPR_BIN=$RUNNER_TEMP/tfpr" >>"$GITHUB_ENV"
          echo "TFPR_ENGINE_DIR=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      - name: Parse event
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_IS_PR: ${{ github.event.issue.pull_request != null }}
          COMMENT_PR: ${{ github.event.issue.number }}
          DISPATCH_COMMAND: ${{ inputs.command || github.event.inputs.command }}
          DISPATCH_PROJECT: ${{ inputs.project || github.event.inputs.project }}
          DISPATCH_PR: ${{ inputs.pr_number || github.event.inputs.pr_number }}
        run: '"$TFPR_BIN" parse-event'

      # The job filter above proves standing in the organization, not write access
      # here. Re-check the commenter's real repository permission before a command
      # that changes something: /unlock releases the cross-PR unit locks that stop
      # a stale plan from reverting an applied change, and /apply runs terraform.
      # Every later step and job keys on this step's run output, not parse's, so a
      # refusal stops the whole thing. Refused commands are answered on the PR.
      - name: Authorize command
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMAND: ${{ steps.parse.outputs.command }}
          PARSED_RUN: ${{ steps.parse.outputs.run }}
          ACTOR: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REQUIRED_PERMISSION: write
        run: '"$TFPR_BIN" authorize-command'

      # Acknowledge a comment command right away (eyes = seen), before the slower
      # discovery and the plan/apply check run. Best effort; never fails the run.
      - name: Acknowledge command
        if: >-
          steps.auth.outputs.run == 'true' &&
          github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION: eyes
        run: '"$TFPR_BIN" react'

      # Discovery is skipped for unlock: releasing locks needs only the PR
      # number, and on a merged PR the head branch may already be deleted, which
      # would fail the changed-files fetch. head_sha stays empty, so every
      # downstream step and job that keys on it skips itself.
      - name: Resolve PR head and base
        id: pr
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command != 'unlock'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
        run: |
          read -r head base sha cross < <(gh pr view "$PR_NUMBER" \
            --json headRefName,baseRefName,headRefOid,isCrossRepository \
            --jq '"\(.headRefName) \(.baseRefName) \(.headRefOid) \(.isCrossRepository)"')
          if [ "$cross" = "true" ]; then
            echo "fork pull requests are not supported" >&2
            exit 1
          fi
          echo "head_ref=$head" >>"$GITHUB_OUTPUT"
          echo "base_ref=$base" >>"$GITHUB_OUTPUT"
          echo "head_sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Compute changed files
        id: changed
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command != 'unlock'
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          CONFIG_FILE: ${{ env.CONFIG_FILE }}
        run: '"$TFPR_BIN" changed-files'

      # The workspace holds the default branch, so a unit that exists only on the
      # PR branch is invisible to terragrunt discovery. Check out the PR head into
      # the working tree (as data to discover; the engine stays pinned in
      # .tfpr-engine) so net-new units are seen. Resolve holds no id-token, so no
      # Azure privilege is widened. A plain git checkout is used, not a second
      # actions/checkout, whose git clean would wipe .tfpr-engine.
      - name: Checkout PR head for discovery
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command != 'unlock'
        env:
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git fetch --quiet origin "refs/pull/${PR_NUMBER}/head"
          git checkout --quiet --force "$HEAD_SHA"

      # Terragrunt discovery needs terragrunt available in resolve. The mode
      # comes from the same parse that drives discovery, so the two can never
      # disagree; install only then (other modes are pure filesystem).
      - name: Detect terragrunt mode
        id: mode
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command != 'unlock'
        run: |
          mode="$("$TFPR_BIN" discover --print-mode)"
          if [ "$mode" = terragrunt ]; then echo "tg=true" >>"$GITHUB_OUTPUT"; else echo "tg=false" >>"$GITHUB_OUTPUT"; fi

      # setup-tools' local action path cannot take an expression, so vendored and
      # reusable modes are two mutually exclusive steps (engine at ./ vs .tfpr-engine).
      - name: Setup tools (terragrunt discovery)
        if: steps.auth.outputs.run == 'true' && steps.mode.outputs.tg == 'true' && job.workflow_repository == github.repository
        uses: ./.github/actions/setup-tools
        with:
          tools: terragrunt
          terragrunt_version: ${{ env.FALLBACK_TERRAGRUNT_VERSION }}

      - name: Setup tools (terragrunt discovery, reusable)
        if: steps.auth.outputs.run == 'true' && steps.mode.outputs.tg == 'true' && job.workflow_repository != github.repository
        uses: ./.tfpr-engine/.github/actions/setup-tools
        with:
          tools: terragrunt
          terragrunt_version: ${{ env.FALLBACK_TERRAGRUNT_VERSION }}

      - name: Select projects
        id: select
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command != 'unlock'
        env:
          CONFIG_FILE: ${{ env.CONFIG_FILE }}
          PROJECT_FILTER: ${{ steps.parse.outputs.project_filter }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # A filtered apply selects exactly the named unit; discovery needs
          # the command to know not to pull dependents in.
          COMMAND: ${{ steps.parse.outputs.command }}
          # The removed-unit check reuses this inventory instead of
          # re-discovering the PR tree.
          TFPR_UNITS_FILE: ${{ runner.temp }}/tfpr-head-units.json
        run: '"$TFPR_BIN" discover'

      # A filtered run's gate judges every unit the PR impacts, not just the one
      # the selector named (#360), so discover that set too, without the filter.
      - name: Select the full impacted set
        id: full_select
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command != 'unlock' &&
          steps.parse.outputs.project_filter != ''
        env:
          CONFIG_FILE: ${{ env.CONFIG_FILE }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          COMMAND: ${{ steps.parse.outputs.command }}
        run: '"$TFPR_BIN" discover'

      # Discovery walks the PR tree, so a unit directory deleted on this branch is
      # discovered by nothing: never selected, never planned, never destroyed, and
      # with an empty selection the merge gate used to call the PR "No Terraform
      # changes". Discover the base tree too (git archive of origin/<base>, which
      # the changed-files step already fetched) and diff the two inventories.
      # It reports and does not block: the engine cannot destroy a unit it can no
      # longer discover, so the manual procedure goes on the PR instead. Teaching
      # it to destroy is nrit-solutions/nrit-alz-platform-internal-docs#7.
      - name: Detect removed units
        id: removed
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command != 'unlock'
        env:
          CONFIG_FILE: ${{ env.CONFIG_FILE }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          HEAD_UNITS_FILE: ${{ runner.temp }}/tfpr-head-units.json
          REMOVED_REPORT_FILE: ${{ runner.temp }}/tfpr-removed.md
        run: '"$TFPR_BIN" detect-removed-units'

      # A status description has no room to say which units went, or what the
      # reader has to do by hand about it, so put that on the PR.
      - name: Report removed units
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.removed.outputs.removed_units != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          REPORT_FILE: ${{ runner.temp }}/tfpr-removed.md
        run: '"$TFPR_BIN" comment'

      # A selector that matches nothing was previously ignored in silence: the
      # run job skipped on count 0 and the only signal was a failing merge
      # gate. Say what happened, on the comment that asked for it.
      - name: Answer unmatched project selector
        if: >-
          steps.auth.outputs.run == 'true' &&
          github.event_name == 'issue_comment' &&
          steps.parse.outputs.project_filter != '' &&
          steps.select.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          FILTER: ${{ steps.parse.outputs.project_filter }}
        run: |
          gh api -X POST "repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=confused >/dev/null || true
          gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$(printf \
            '❓ No project matches `%s`. The selector must equal a project label, name, or dir from `projects.yml` (labels are `<dir>/<name>`, or the unit path in terragrunt mode). Comment the command without `-p` to run every impacted project, or `/help` for the command list.' \
            "$FILTER")" >/dev/null

      # The license state (#350). Every job checks and reports it; only an
      # /apply is refused, here with one reply, and the apply job checks
      # again. The newest revocation list is kept in the actions cache, so a
      # failed download falls back to the last good copy. The tenant comes
      # from the AZURE_TENANT_ID variable, never from a secret.
      - name: Restore the revocation list
        if: steps.auth.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tfpr-license
          key: tfpr-license-${{ github.run_id }}
          restore-keys: tfpr-license-

      - name: License check
        id: license
        if: steps.auth.outputs.run == 'true'
        env:
          TFPR_LICENSE: ${{ vars.TFPR_LICENSE }}
          TFPR_ENTITLEMENT: ${{ vars.TFPR_ENTITLEMENT }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMAND: ${{ steps.parse.outputs.command }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          TFPR_LICENSE_HANDOVER: ${{ runner.temp }}/tfpr-license-handover/revocations.jws
        run: '"$TFPR_BIN" license gate-apply'

      # The list for the later jobs of this run (see tfpr license).
      - name: Hand over the revocation list
        if: steps.license.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfpr-license
          path: ${{ runner.temp }}/tfpr-license-handover/revocations.jws
          retention-days: 1
          overwrite: true

      # A unique key per run: cache entries cannot be overwritten, and the
      # restore above takes the newest entry under the prefix.
      - name: Save the revocation list
        if: steps.license.outputs.cache_updated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tfpr-license
          key: tfpr-license-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      # Gate apply on the repo's required approvals (GitHub review decision). This
      # runs on every apply path, not just the comment one: apply_allowed requires
      # approved == 'true', so a path that skipped the gate would leave the output
      # empty and be refused.
      - name: Approval gate
        id: approval
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command == 'apply' &&
          steps.license.outputs.apply_refused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          ALLOW_UNREVIEWED_APPLY: ${{ vars.TFPR_ALLOW_UNREVIEWED_APPLY }}
        run: '"$TFPR_BIN" check-approval'

      # One source for the job outputs. check_run_id/number are the run
      # identity stamped on the PR checks this run creates, so the checks
      # one run creates are the checks the run doing the work completes.
      - name: Merge resolve outputs
        id: ctx
        if: steps.auth.outputs.run == 'true'
        env:
          PROJECTS: ${{ steps.select.outputs.projects }}
          COUNT: ${{ steps.select.outputs.count }}
          UNATTRIBUTED: ${{ steps.select.outputs.unattributed }}
          TF_CHANGED: ${{ steps.changed.outputs.tf_changed }}
          REMOVED_UNITS: ${{ steps.removed.outputs.removed_units }}
          REMOVED_CHECK: ${{ steps.removed.outputs.removed_check }}
          REMOVED_EXPLAINS_TF: ${{ steps.removed.outputs.removed_explains_tf }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          {
            printf 'projects=%s\n' "$PROJECTS"
            printf 'count=%s\n' "$COUNT"
            printf 'unattributed=%s\n' "$UNATTRIBUTED"
            printf 'tf_changed=%s\n' "$TF_CHANGED"
            printf 'removed_units=%s\n' "$REMOVED_UNITS"
            printf 'removed_check=%s\n' "$REMOVED_CHECK"
            printf 'removed_explains_tf=%s\n' "$REMOVED_EXPLAINS_TF"
            printf 'head_sha=%s\n' "$HEAD_SHA"
            printf 'check_run_id=%s\n' "$RUN_ID"
            printf 'check_run_number=%s\n' "$RUN_NUMBER"
          } >>"$GITHUB_OUTPUT"

      # Fold run, command, count and approved into the apply job's one
      # condition. Unconditional, so the output is never empty: the binary
      # turns every skipped step above into false (internal/ghops/approval.go).
      - name: Decide apply
        id: apply_gate
        env:
          RUN: ${{ steps.auth.outputs.run }}
          COMMAND: ${{ steps.parse.outputs.command }}
          COUNT: ${{ steps.ctx.outputs.count }}
          APPROVED: ${{ steps.approval.outputs.approved }}
          LICENSED: ${{ steps.license.outputs.apply_licensed }}
        run: '"$TFPR_BIN" apply-allowed'

      # Checks created with the workflow token land in an arbitrary Actions
      # check suite, so the PR renders them under an unrelated workflow's
      # heading. When the consumer configures the dedicated checks App, the
      # checks are created (and must then be completed and swept) with its
      # token instead, giving them the App's own heading. Unset, the
      # workflow token keeps today's behavior. A configured client id with
      # a broken key fails loudly here rather than split-braining creation
      # and completion across two apps.
      - name: Checks app token
        id: checks_token
        if: vars.TFPR_CHECKS_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TFPR_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.TFPR_CHECKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Publish the approval state as the informational "tf-pr-ops / approval"
      # check run, created completed. The approval gate above only evaluates on
      # an apply command, so a required-approval ruleset is otherwise invisible
      # until an apply is refused; this runs on plans too, so the requirement
      # is discoverable from the first run. A run that selects nothing skips
      # it: there is nothing to apply.
      - name: Approval check
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.ctx.outputs.count != '0' &&
          steps.parse.outputs.pr_number != '' &&
          steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token || github.token }}
          # The checks App holds Checks permissions only; the reviewDecision
          # query runs on the workflow token.
          GH_QUERY_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALLOW_UNREVIEWED_APPLY: ${{ vars.TFPR_ALLOW_UNREVIEWED_APPLY }}
        run: '"$TFPR_BIN" approval-status'

      # Open the merge gate for this run: the required "tf-pr-ops / merge-gate"
      # check goes in progress ("Planning 2 units", "Applying 1 unit") the
      # moment the engine takes the PR, replacing the ruleset's "Expected"
      # placeholder, and is completed by the gate job of whichever run owns
      # the results. The binary skips
      # filtered runs (a diagnostic must not reopen the gate); the conditions
      # skip refused applies, by approval or license (nothing would complete
      # it), and the unlock path.
      - name: Open merge gate
        id: gate_pending
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.parse.outputs.command != 'unlock' &&
          steps.pr.outputs.head_sha != '' &&
          steps.approval.outputs.approved != 'false' &&
          steps.license.outputs.apply_refused != 'true'
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT_FILTER: ${{ steps.parse.outputs.project_filter }}
          COMMAND: ${{ steps.parse.outputs.command }}
          COUNT: ${{ steps.ctx.outputs.count }}
        run: '"$TFPR_BIN" checks gate-pending'

      # Engine work still running on this pull request: a /plan or /apply on
      # this head, or an apply of the previous head that a push left behind
      # (the dispatch action's before_sha hint; check runs stay on a commit
      # even after a force-push drops it). The plan or apply job below queues
      # behind it on the PR's concurrency group, and the checks created next
      # say so instead of sitting in progress unexplained (#290).
      - name: Find running work
        id: running
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.select.outputs.count != '0' &&
          steps.pr.outputs.head_sha != '' &&
          steps.approval.outputs.approved != 'false' &&
          steps.license.outputs.apply_refused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BEFORE_SHA: ${{ inputs.before_sha || github.event.inputs.before_sha }}
        run: '"$TFPR_BIN" checks running'

      # Engine-created check runs on the head commit, one per project,
      # completed in-run; the run itself is not attached to the PR at all.
      # Visibility only: the call is best effort and the step cannot fail the
      # job, so a check-runs API outage never takes the merge gate with it.
      - name: Create PR checks
        id: checks
        continue-on-error: true
        if: >-
          steps.auth.outputs.run == 'true' &&
          steps.select.outputs.count != '0' &&
          steps.pr.outputs.head_sha != '' &&
          steps.approval.outputs.approved != 'false' &&
          steps.license.outputs.apply_refused != 'true'
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          WAITING_FOR: ${{ steps.running.outputs.running }}
          WAITING_FOR_URL: ${{ steps.running.outputs.running_url }}
          COMMAND: ${{ steps.parse.outputs.command }}
          PROJECTS: ${{ steps.select.outputs.projects }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Name and stamp the checks with this run, so concurrent runs on the
          # same commit neither collide in the checks list nor complete each
          # other's checks (see internal/ghops/checks.go).
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: '"$TFPR_BIN" checks create'

  # The two comment answers that resolve never sees: a refusal for an author it
  # declines, and /help, which resolve's own filter excludes. Both are one gh
  # call on a hosted runner, so they share a job; every job in this workflow
  # reports a check on the pull request even when skipped, and these are skipped
  # on every event that is not a comment.
  #
  # Neither can fold into resolve. Resolve runs only for an author with standing
  # in the organization, and only for /plan, /apply and /unlock; widening it
  # would mean a checkout and a runtime install for a drive-by outsider's
  # comment. The gh calls are inlined rather than installing tfpr for the
  # same reason: a job that only posts one comment needs neither.
  comment-reply:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.repository.is_template != true &&
      github.event.issue.pull_request != null &&
      ((!contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/plan') ||
         startsWith(github.event.comment.body, '/apply') ||
         startsWith(github.event.comment.body, '/unlock') ||
         startsWith(github.event.comment.body, '/help'))) ||
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/help')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A silently skipped workflow reads as a broken engine, so say what
      # happened and why.
      - name: Refuse the command
        if: >-
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
        run: |
          gh api -X POST "repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=confused >/dev/null || true
          gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$(printf \
            '🚫 **Command refused**: `@%s` is not authorized to run Terraform commands here. Only repository owners, organization members and collaborators can run `/plan` and `/apply`. Ask one of them to run the command.' \
            "$ACTOR")" >/dev/null

      # Answer /help without discovery, cloud credentials, or an engine
      # checkout. The job gate above sends an unauthorized /help to the refusal
      # instead of here, so it is never answered twice.
      - name: Post the command list
        if: >-
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api -X POST "repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes >/dev/null || true
          gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -F body=@- >/dev/null <<'EOF'
          ### tf-pr-ops commands

          | Comment | Effect |
          | --- | --- |
          | `/plan` | Plan changed projects |
          | `/plan -p <label>` | Plan one project and its dependents (label, name, or dir) |
          | `/apply` | Apply changed projects in dependency order (requires the repo's required reviews) |
          | `/apply -p <label>` | Apply exactly one project, no dependents |
          | `/apply --force` | Apply even when the plan changed since it was reviewed |
          | `/unlock` | Force-release this PR's unit locks |
          | `/help` | Show this message |

          Merge is gated by the `tf-pr-ops / merge-gate` check: it goes green when the latest plan is clean or the PR is applied.
          EOF

  # Plan every impacted project in parallel. The matrix lives in a called
  # workflow (.github/workflows/plan.yml) so this job can carry a static name: a
  # skipped matrix job prints its name template verbatim, and this job is skipped
  # on every run that does not plan, which includes every no-op pull request and
  # every comment-driven run. The called workflow's matrix supplies the readable
  # per-project rows when a plan does happen. Apply is dependency-ordered and
  # runs in the separate `apply` job below, not as a parallel matrix.
  plan:
    name: plan
    needs: resolve
    if: >-
      needs.resolve.outputs.run == 'true' &&
      needs.resolve.outputs.command == 'plan' &&
      needs.resolve.outputs.count != '0' &&
      needs.resolve.outputs.approved != 'false'
    # The ceiling for the called workflow. It requests the same set per job.
    permissions:
      contents: read
      id-token: write        # Azure OIDC login
      pull-requests: write   # post the run report
      checks: write          # complete the pre-created PR check
    # Relative refs resolve against this file's own repository and commit, so a
    # consumer calling the engine at a pinned ref gets plan.yml from that ref
    # too. `uses:` takes no expression, so this is the only form that can stay
    # pinned.
    # One concurrency family per pull request, shared with the apply job:
    # a plan queues behind a running apply of the same PR instead of
    # planning units whose state is changing under it (#290). The called
    # matrix legs still serialize per unit on tfpr-<label>.
    concurrency:
      group: tfpr-pr-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    uses: ./.github/workflows/plan.yml
    with:
      command: ${{ needs.resolve.outputs.command }}
      projects: ${{ needs.resolve.outputs.projects }}
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      check_run_id: ${{ needs.resolve.outputs.check_run_id }}
      check_run_number: ${{ needs.resolve.outputs.check_run_number }}
      # A push is a dispatch carrying the trigger_actor hint; a dispatch by
      # hand carries none.
      trigger_event: ${{ github.event_name == 'issue_comment' && 'comment' || ((inputs.trigger_actor || github.event.inputs.trigger_actor) != '' && 'push' || 'manual') }}
      trigger_command: ${{ (github.event_name == 'issue_comment' || (inputs.trigger_actor || github.event.inputs.trigger_actor) == '') && format('/plan{0}', needs.resolve.outputs.project_filter != '' && format(' -p {0}', needs.resolve.outputs.project_filter) || '') || '' }}
      trigger_actor: ${{ inputs.trigger_actor || github.event.inputs.trigger_actor || github.actor }}
      license_list_source: ${{ needs.resolve.outputs.license_list_source }}
    # Explicit, not inherit: this workflow runs for callers in any organization.
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      TFPR_CHECKS_APP_PRIVATE_KEY: ${{ secrets.TFPR_CHECKS_APP_PRIVATE_KEY }}

  apply:
    # Dependency-ordered apply. Unlike plan, apply cannot fan out into a parallel
    # matrix: a Terragrunt unit must apply after the units it depends on so their
    # outputs are real, not mocked. A single job walks the topologically-sorted
    # impacted set (built by discover-terragrunt.sh) and applies one unit at a
    # time, skipping any unit whose dependency failed. Plain Terraform projects
    # have no deps, so this degrades to a simple ordered loop for them.
    name: apply (dependency order)
    needs: resolve
    # apply_allowed is resolve's one tested verdict: run, an apply command, a
    # non-zero count, and approved exactly 'true'. An empty approved output
    # means the gate never ran, which is a bug, not consent.
    if: needs.resolve.outputs.apply_allowed == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Bind the OIDC login to the apply environment (its federated subject is
    # scoped to this). Override the name with TFPR_APPLY_ENVIRONMENT.
    environment: ${{ vars.TFPR_APPLY_ENVIRONMENT || 'apply' }}
    permissions:
      contents: read
      id-token: write        # Azure OIDC login
      pull-requests: write   # post the run report
      checks: write          # complete the pre-created PR check
    # The PR's one concurrency family, shared with the plan jobs above: two
    # /apply comments never race, and a push mid-apply queues its plan
    # here until the apply finishes (#290). The plan matrix legs also hold
    # tfpr-<label>, so a unit already planning on this PR is walked only
    # after that plan job has released the group.
    concurrency:
      group: tfpr-pr-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      BACKEND_AZURE_RESOURCE_GROUP_NAME: ${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}
      BACKEND_AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}
      BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME: ${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}
    steps:
      # Check out the exact commit resolve pinned and gated on. The moving PR head
      # ref would let a push during environment approval or runner queueing apply
      # code that nobody approved, and publish it against the stale commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0

      # Reusable mode: install the runtime published with the release that
      # holds this workflow file (job.workflow_ref), from the public
      # entrypoint repo; no token, no private checkout. Vendored mode (the
      # engine repository itself) builds tfpr from its own checkout.
      - name: Install the engine runtime
        if: job.workflow_repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TFPR_RUNTIME_REPO: ${{ job.workflow_repository }}
          TFPR_RUNTIME_REF: ${{ job.workflow_ref }}
          TFPR_RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/install-runtime.sh" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$TFPR_RUNTIME_REPO/contents/install-runtime.sh?ref=$TFPR_RUNTIME_SHA"
          bash "$RUNNER_TEMP/install-runtime.sh"

      - name: Set up Go
        if: job.workflow_repository == github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tfpr
        if: job.workflow_repository == github.repository
        run: |
          go build -o "$RUNNER_TEMP/tfpr" ./cmd/tfpr
          echo "TFPR_BIN=$RUNNER_TEMP/tfpr" >>"$GITHUB_ENV"
          echo "TFPR_ENGINE_DIR=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Runs after the runtime install and before any project code,
      # so a head that moved stops the apply.
      - name: Verify PR head is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: '"$TFPR_BIN" verify-head'

      # The approval gate ran back in resolve. A review dismissed during
      # environment approval or runner queueing moves no commit, so the head
      # check above cannot see it. Re-read the decision here, still before any
      # terraform runs, and fail the job when it no longer holds.
      - name: Re-check approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          ALLOW_UNREVIEWED_APPLY: ${{ vars.TFPR_ALLOW_UNREVIEWED_APPLY }}
          APPROVAL_MODE: recheck
        run: '"$TFPR_BIN" check-approval'

      # The license may have changed since resolve allowed this apply: a
      # revocation takes effect on the next run. Download the list again and
      # stop before any terraform runs when the state is plan only.
      - name: Restore the revocation list
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tfpr-license
          key: tfpr-license-${{ github.run_id }}
          restore-keys: tfpr-license-

      - name: Re-check license
        id: license
        env:
          TFPR_LICENSE: ${{ vars.TFPR_LICENSE }}
          TFPR_ENTITLEMENT: ${{ vars.TFPR_ENTITLEMENT }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: '"$TFPR_BIN" license recheck'

      - name: Save the revocation list
        if: steps.license.outputs.cache_updated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tfpr-license
          key: tfpr-license-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      # setup-tools' local action path cannot take an expression, so vendored and
      # reusable modes are two mutually exclusive steps (engine at ./ vs .tfpr-engine).
      # extra_tools mirrors the plan job: the apply path re-plans and runs the
      # same post_plan hooks, so the hook tools must be installed here too, or
      # every gate reports its tool missing on the apply report.
      - name: Setup tools
        if: job.workflow_repository == github.repository
        uses: ./.github/actions/setup-tools
        with:
          tools: terraform terragrunt
          terraform_version: ${{ env.FALLBACK_TERRAFORM_VERSION }}
          terragrunt_version: ${{ env.FALLBACK_TERRAGRUNT_VERSION }}
          extra_tools: ${{ vars.TFPR_EXTRA_TOOLS }}

      - name: Setup tools (reusable)
        if: job.workflow_repository != github.repository
        uses: ./.tfpr-engine/.github/actions/setup-tools
        with:
          tools: terraform terragrunt
          terraform_version: ${{ env.FALLBACK_TERRAFORM_VERSION }}
          terragrunt_version: ${{ env.FALLBACK_TERRAGRUNT_VERSION }}
          extra_tools: ${{ vars.TFPR_EXTRA_TOOLS }}

      # Only the app that created a check may complete it, so the per-unit
      # completion inside the apply walk must present the same identity
      # resolve created the checks with. The report comments in the same
      # script keep the workflow token: the App holds Checks permissions
      # only.
      - name: Checks app token
        id: checks_token
        if: vars.TFPR_CHECKS_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TFPR_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.TFPR_CHECKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Providers across runs and, in the apply walk, across units: Terraform's
      # plugin cache, keyed on the lock files. A unit is served from it only
      # when its lock file carries the h1 hash for this platform (terraform
      # providers lock -platform=linux_amd64); otherwise Terraform downloads
      # from the registry and fills the cache for next time (#188).
      # A path that is the same on every runner instance: actions/cache hashes
      # the path into the cache version, and runner.temp carries the instance
      # name on ephemeral self-hosted runners, so a cache saved there was
      # never found again (#284).
      - name: Provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tfpr-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            tfpr-providers-${{ runner.os }}-${{ runner.arch }}-

      # Point every unit's pre-created check at this job, so "View more
      # details" opens the live apply log rather than the run overview.
      - name: Link PR checks to this job
        if: needs.resolve.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          PROJECTS: ${{ needs.resolve.outputs.projects }}
          JOB_SHA: ${{ github.sha }}
          JOB_RUN_ID: ${{ github.run_id }}
          JOB_NAME: apply (dependency order)
        run: '"$TFPR_BIN" checks link'

      - name: Apply in dependency order
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CHECKS_TOKEN: ${{ steps.checks_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PROJECTS: ${{ needs.resolve.outputs.projects }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Passed through to the per-unit check completion (see lib.sh).
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB_SHA: ${{ github.sha }}
          JOB_RUN_ID: ${{ github.run_id }}
          JOB_NAME: apply (dependency order)
          TFPR_MINIMIZE_OUTDATED: ${{ vars.TFPR_MINIMIZE_OUTDATED }}
          TFPR_CHECK_LIVE_LOG: ${{ vars.TFPR_CHECK_LIVE_LOG }}
          INIT_ARGS: ${{ vars.TFPR_INIT_ARGS }}
          # For consumers that list the cost gate under the apply stage (#264, #270).
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          # /apply --force: apply even when the plan differs from the reviewed one.
          TFPR_APPLY_FORCE: ${{ needs.resolve.outputs.force }}
          TFPR_TRIGGER_EVENT: ${{ github.event_name == 'issue_comment' && 'comment' || 'manual' }}
          TFPR_TRIGGER_COMMAND: ${{ format('/apply{0}{1}', needs.resolve.outputs.project_filter != '' && format(' -p {0}', needs.resolve.outputs.project_filter) || '', needs.resolve.outputs.force == 'true' && ' --force' || '') }}
          TFPR_TRIGGER_ACTOR: ${{ github.actor }}
          # Cross-PR unit lock ownership (tfpr lock).
          TFPR_LOCK_STORAGE_ACCOUNT: ${{ vars.TFPR_LOCK_STORAGE_ACCOUNT }}
          TFPR_LOCK_TABLE: ${{ vars.TFPR_LOCK_TABLE }}
          TFPR_DISABLE_LOCKS: ${{ vars.TFPR_DISABLE_LOCKS }}
        run: TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache" "$TFPR_BIN" apply-ordered

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-apply
          path: |
            gate/*.status
            gate/*.lock
          retention-days: 1

  # Release every cross-PR unit lock the PR holds. Two triggers land here: the
  # PR closing (merged or not; automatic) and an explicit /unlock comment (to
  # free units held by an abandoned-but-still-open PR). Runs on the project
  # runner with an Azure OIDC login because the lock table lives on the
  # (network-scoped) state storage account, so it has to bind an environment:
  # tenants that require an environment claim reject a subject without one.
  # It defaults to the plan environment, but takes its own name first, because
  # required reviewers on plan would otherwise make every closed PR wait for a
  # human before its locks are released. The job only exists when locking is
  # configured and enabled.
  unlock:
    name: unlock
    needs: resolve
    if: >-
      needs.resolve.outputs.run == 'true' &&
      needs.resolve.outputs.command == 'unlock' &&
      vars.TFPR_DISABLE_LOCKS != 'true' &&
      (vars.TFPR_LOCK_STORAGE_ACCOUNT != '' || vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME != '')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ vars.TFPR_UNLOCK_ENVIRONMENT || vars.TFPR_PLAN_ENVIRONMENT || 'plan' }}
    permissions:
      contents: read
      id-token: write        # Azure OIDC login
      pull-requests: write   # confirm /unlock with a comment
    env:
      TFPR_LOCK_STORAGE_ACCOUNT: ${{ vars.TFPR_LOCK_STORAGE_ACCOUNT }}
      TFPR_LOCK_TABLE: ${{ vars.TFPR_LOCK_TABLE }}
      BACKEND_AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reusable mode: install the runtime published with the release that
      # holds this workflow file (job.workflow_ref), from the public
      # entrypoint repo; no token, no private checkout. Vendored mode (the
      # engine repository itself) builds tfpr from its own checkout.
      - name: Install the engine runtime
        if: job.workflow_repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TFPR_RUNTIME_REPO: ${{ job.workflow_repository }}
          TFPR_RUNTIME_REF: ${{ job.workflow_ref }}
          TFPR_RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/install-runtime.sh" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$TFPR_RUNTIME_REPO/contents/install-runtime.sh?ref=$TFPR_RUNTIME_SHA"
          bash "$RUNNER_TEMP/install-runtime.sh"

      - name: Set up Go
        if: job.workflow_repository == github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tfpr
        if: job.workflow_repository == github.repository
        run: |
          go build -o "$RUNNER_TEMP/tfpr" ./cmd/tfpr
          echo "TFPR_BIN=$RUNNER_TEMP/tfpr" >>"$GITHUB_ENV"
          echo "TFPR_ENGINE_DIR=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      # Never fatal: without the file the check reports no list, and the
      # gate and the drift report must still complete.
      - name: Receive the revocation list
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfpr-license
          path: ${{ runner.temp }}/tfpr-license-handover

      # Verify and report the license with the list resolve loaded (#350).
      - name: License check
        env:
          TFPR_LICENSE: ${{ vars.TFPR_LICENSE }}
          TFPR_ENTITLEMENT: ${{ vars.TFPR_ENTITLEMENT }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          TFPR_LICENSE_LIST_FILE: ${{ runner.temp }}/tfpr-license-handover/revocations.jws
          TFPR_LICENSE_LIST_SOURCE: ${{ needs.resolve.outputs.license_list_source || 'none' }}
        run: '"$TFPR_BIN" license check'

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Release unit locks
        id: locks
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: '"$TFPR_BIN" lock release-pr'

      # Comment path only: answer the explicit /unlock. The automatic PR-close
      # release stays silent to avoid a comment on every merged PR.
      - name: Confirm unlock
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RELEASED: ${{ steps.locks.outputs.released }}
        run: |
          printf '🔓 Released %s unit lock(s) held by this PR.\n' "${RELEASED:-0}" > .tfpr-unlock.md
          REPORT_FILE=.tfpr-unlock.md "$TFPR_BIN" comment

  # Aggregate per-project outcomes into the stable tf-pr-ops / merge-gate
  # check that gates merge. Make it a required check in the ruleset.
  gate:
    needs: [resolve, plan, apply]
    # Every verdict input comes from resolve, which read it from the API in
    # this run; no dispatch input reaches the gate (#348).
    if: >-
      always() &&
      needs.resolve.outputs.run == 'true' && needs.resolve.outputs.head_sha != ''
    # Status aggregation via gh only; no Azure. Hosted runner (see resolve).
    runs-on: ubuntu-latest
    # The checks App key, as in resolve.
    environment: ${{ vars.TFPR_PLAN_ENVIRONMENT || 'plan' }}
    steps:
      # Reusable mode: install the runtime published with the release that
      # holds this workflow file (job.workflow_ref), from the public
      # entrypoint repo; no token, no private checkout. Vendored mode (the
      # engine repository itself) builds tfpr from its own checkout.
      - name: Install the engine runtime
        if: job.workflow_repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TFPR_RUNTIME_REPO: ${{ job.workflow_repository }}
          TFPR_RUNTIME_REF: ${{ job.workflow_ref }}
          TFPR_RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/install-runtime.sh" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$TFPR_RUNTIME_REPO/contents/install-runtime.sh?ref=$TFPR_RUNTIME_SHA"
          bash "$RUNNER_TEMP/install-runtime.sh"

      - name: Checkout (vendored mode)
        if: job.workflow_repository == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: job.workflow_repository == github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tfpr
        if: job.workflow_repository == github.repository
        run: |
          go build -o "$RUNNER_TEMP/tfpr" ./cmd/tfpr
          echo "TFPR_BIN=$RUNNER_TEMP/tfpr" >>"$GITHUB_ENV"
          echo "TFPR_ENGINE_DIR=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      # Never fatal: without the file the check reports no list, and the
      # gate and the drift report must still complete.
      - name: Receive the revocation list
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfpr-license
          path: ${{ runner.temp }}/tfpr-license-handover

      # Verify and report the license with the list resolve loaded (#350).
      - name: License check
        env:
          TFPR_LICENSE: ${{ vars.TFPR_LICENSE }}
          TFPR_ENTITLEMENT: ${{ vars.TFPR_ENTITLEMENT }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          TFPR_LICENSE_LIST_FILE: ${{ runner.temp }}/tfpr-license-handover/revocations.jws
          TFPR_LICENSE_LIST_SOURCE: ${{ needs.resolve.outputs.license_list_source || 'none' }}
        run: '"$TFPR_BIN" license check'

      # Only the app that created a check may complete it, so completing the
      # merge gate and sweeping the leftovers must present the same identity
      # that created them in resolve.
      - name: Checks app token
        id: checks_token
        if: vars.TFPR_CHECKS_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TFPR_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.TFPR_CHECKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Download gate results
        if: needs.resolve.outputs.count != '0'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-*
          path: gate
          merge-multiple: true
      # Complete the pending gate check with the verdict (or create it
      # completed when this run never opened one). The run id is the check
      # stamp. This must run before the leftover sweep below, which cancels
      # any still-open check under the same stamp.
      - name: Complete merge gate
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          COMMAND: ${{ needs.resolve.outputs.command }}
          COUNT: ${{ needs.resolve.outputs.count }}
          TF_CHANGED: ${{ needs.resolve.outputs.tf_changed }}
          UNATTRIBUTED: ${{ needs.resolve.outputs.unattributed }}
          PROJECT_FILTER: ${{ needs.resolve.outputs.project_filter }}
          FULL_PROJECTS: ${{ needs.resolve.outputs.full_projects }}
          FULL_UNATTRIBUTED: ${{ needs.resolve.outputs.full_unattributed }}
          # Only rows this App wrote may decide a filtered run's gate.
          CHECKS_APP_SLUG: ${{ steps.checks_token.outputs.app-slug }}
          REMOVED_UNITS: ${{ needs.resolve.outputs.removed_units }}
          REMOVED_CHECK: ${{ needs.resolve.outputs.removed_check }}
          REMOVED_EXPLAINS_TF: ${{ needs.resolve.outputs.removed_explains_tf }}
          RESULT_DIR: gate
          RUN_ID: ${{ needs.resolve.outputs.check_run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$TFPR_BIN" merge-gate'

      # The run and apply jobs have reported by now, so any check still
      # in_progress under this run's stamp belongs to a job that never got
      # there (runner offline, environment approval denied, canceled). Complete
      # those as canceled; a check that never completes blocks merge forever.
      # Best effort, and runs even when the gate status above failed.
      - name: Cancel leftover PR checks
        if: always()
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          RUN_ID: ${{ needs.resolve.outputs.check_run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$TFPR_BIN" checks cancel'
