name: drift

# Scheduled drift detection, native GitHub Actions, self-contained (no external
# reusable workflow). Once a day (and on demand):
#   resolve     lists every project/unit for a drift sweep (projects.yml `drift`
#               block can scope or disable it), no cloud login
#   drift-plan  plans each one read-only against the deployed tenant, on the
#               self-hosted runner (state is firewalled), and uploads just the
#               result (status + plan report) as an artifact
#   report      on a hosted runner, turns those results into GitHub Issues: one
#               issue per drifted unit, opened/refreshed on drift and closed when
#               it comes back clean
#
# The split exists because only the plan needs Terraform state (behind a private
# endpoint, so it must run on the self-hosted runner, which has no gh); issue
# management needs only the GitHub API, so it runs on a hosted runner with gh.
#
# Read-only: drift-plan runs the plan (Reader) identity in the `plan`
# environment, the same identity and environment the PR plan uses, so it can
# never change the tenant. The OIDC subject binds the repo and the `plan`
# environment, so this reuses the plan federated credential with no new setup;
# keep the `plan` environment name stable (the subject embeds it).

on:
  schedule:
    # Daily at 06:17 UTC. Off the hour to dodge the exact-hour cron congestion
    # GitHub warns about.
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Reusable mode: a consumer repo calls this workflow with `uses:` at a
  # release tag of the public entrypoint repo, and every job installs the
  # runtime of that release (job.workflow_ref).
  workflow_call:
    secrets:
      INFRACOST_API_KEY:
        required: false
      TFPR_CHECKS_APP_PRIVATE_KEY:
        required: false

# Permissions are set per job. resolve does no cloud login, so it must not hold
# id-token: write: this tenant customizes the OIDC subject to require an
# `environment` claim, and a token-capable job that binds no environment fails at
# startup. Only drift-plan (bound to `plan`) gets the token.
permissions:
  contents: read

env:
  CONFIG_FILE: projects.yml
  # Used only when the repo has no version manager (mise/asdf). When it does,
  # those pinned versions win (see .github/actions/setup-tools).
  FALLBACK_TERRAFORM_VERSION: "1.16.5"
  FALLBACK_TERRAGRUNT_VERSION: "1.1.6"

jobs:
  resolve:
    name: resolve
    # A template repository holds no infrastructure and has no bootstrap-created
    # variables or secrets, so the scheduled sweep cannot work there. Skipping stops
    # it failing nightly on the missing variables. A repository
    # generated from a template is not itself a template, so this never skips a
    # customer repo.
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.select.outputs.projects }}
      count: ${{ steps.select.outputs.count }}
      # Where the revocation list in the tfpr-license artifact came from (#350).
      license_list_source: ${{ steps.license.outputs.list_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Reusable mode: install the runtime published with the release that
      # holds this workflow file (job.workflow_ref), from the public
      # entrypoint repo; no token, no private checkout. Vendored mode (the
      # engine repository itself) builds tfpr from its own checkout.
      - name: Install the engine runtime
        if: job.workflow_repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TFPR_RUNTIME_REPO: ${{ job.workflow_repository }}
          TFPR_RUNTIME_REF: ${{ job.workflow_ref }}
          TFPR_RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/install-runtime.sh" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$TFPR_RUNTIME_REPO/contents/install-runtime.sh?ref=$TFPR_RUNTIME_SHA"
          bash "$RUNNER_TEMP/install-runtime.sh"

      - name: Set up Go
        if: job.workflow_repository == github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tfpr
        if: job.workflow_repository == github.repository
        run: |
          go build -o "$RUNNER_TEMP/tfpr" ./cmd/tfpr
          echo "TFPR_BIN=$RUNNER_TEMP/tfpr" >>"$GITHUB_ENV"
          echo "TFPR_ENGINE_DIR=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      # Terragrunt discovery needs terragrunt available. The mode comes from
      # the same parse that drives discovery; install only then (other modes
      # are pure filesystem).
      - name: Detect terragrunt mode
        id: mode
        run: |
          mode="$("$TFPR_BIN" discover --print-mode)"
          if [ "$mode" = terragrunt ]; then echo "tg=true" >>"$GITHUB_OUTPUT"; else echo "tg=false" >>"$GITHUB_OUTPUT"; fi

      # setup-tools' local action path cannot take an expression, so vendored and
      # reusable modes are two mutually exclusive steps (engine at ./ vs .tfpr-engine).
      - name: Setup tools (terragrunt discovery)
        if: steps.mode.outputs.tg == 'true' && job.workflow_repository == github.repository
        uses: ./.github/actions/setup-tools
        with:
          tools: terragrunt
          terragrunt_version: ${{ env.FALLBACK_TERRAGRUNT_VERSION }}

      - name: Setup tools (terragrunt discovery, reusable)
        if: steps.mode.outputs.tg == 'true' && job.workflow_repository != github.repository
        uses: ./.tfpr-engine/.github/actions/setup-tools
        with:
          tools: terragrunt
          terragrunt_version: ${{ env.FALLBACK_TERRAGRUNT_VERSION }}

      # The license state (#350): drift never applies, so it only reports.
      # The drift issue body carries the alert. The newest revocation list is
      # kept in the actions cache, shared with the ops workflow.
      - name: Restore the revocation list
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tfpr-license
          key: tfpr-license-${{ github.run_id }}
          restore-keys: tfpr-license-

      - name: License check
        id: license
        env:
          TFPR_LICENSE: ${{ vars.TFPR_LICENSE }}
          TFPR_ENTITLEMENT: ${{ vars.TFPR_ENTITLEMENT }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          TFPR_LICENSE_HANDOVER: ${{ runner.temp }}/tfpr-license-handover/revocations.jws
        run: '"$TFPR_BIN" license check'

      # The list for the later jobs of this run (see tfpr license).
      - name: Hand over the revocation list
        if: steps.license.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfpr-license
          path: ${{ runner.temp }}/tfpr-license-handover/revocations.jws
          retention-days: 1
          overwrite: true

      - name: Save the revocation list
        if: steps.license.outputs.cache_updated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tfpr-license
          key: tfpr-license-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Select projects (drift sweep)
        id: select
        env:
          CONFIG_FILE: ${{ env.CONFIG_FILE }}
          DRIFT: "1"
        run: '"$TFPR_BIN" discover'

  # Release locks whose holder PR is closed or merged. The closed-event
  # unlock run is the only automatic release path and GitHub creates no run
  # when the head branch dies with the close, so a lock can leak until the
  # unit happens to be contended (#180). The sweep heals leaks on the drift
  # schedule; conflict-time reclaim covers the contended case. No TTL: an
  # open PR's lock stays held however old, a slow but healthy apply must
  # never lose its lock.
  lock-sweep:
    if: >-
      vars.TFPR_DISABLE_LOCKS != 'true' &&
      (vars.TFPR_LOCK_STORAGE_ACCOUNT != '' || vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME != '')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ vars.TFPR_UNLOCK_ENVIRONMENT || vars.TFPR_PLAN_ENVIRONMENT || 'plan' }}
    permissions:
      contents: read
      id-token: write        # Azure OIDC login
      pull-requests: read    # holder PR state
    env:
      TFPR_LOCK_STORAGE_ACCOUNT: ${{ vars.TFPR_LOCK_STORAGE_ACCOUNT }}
      TFPR_LOCK_TABLE: ${{ vars.TFPR_LOCK_TABLE }}
      BACKEND_AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reusable mode: install the runtime published with the release that
      # holds this workflow file (job.workflow_ref), from the public
      # entrypoint repo; no token, no private checkout. Vendored mode (the
      # engine repository itself) builds tfpr from its own checkout.
      - name: Install the engine runtime
        if: job.workflow_repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TFPR_RUNTIME_REPO: ${{ job.workflow_repository }}
          TFPR_RUNTIME_REF: ${{ job.workflow_ref }}
          TFPR_RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/install-runtime.sh" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$TFPR_RUNTIME_REPO/contents/install-runtime.sh?ref=$TFPR_RUNTIME_SHA"
          bash "$RUNNER_TEMP/install-runtime.sh"

      - name: Set up Go
        if: job.workflow_repository == github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tfpr
        if: job.workflow_repository == github.repository
        run: |
          go build -o "$RUNNER_TEMP/tfpr" ./cmd/tfpr
          echo "TFPR_BIN=$RUNNER_TEMP/tfpr" >>"$GITHUB_ENV"
          echo "TFPR_ENGINE_DIR=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sweep stale locks
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$TFPR_BIN" lock sweep-stale'

  drift-plan:
    name: plan (${{ matrix.project.label }})
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Bind OIDC to the plan environment (its federated subject is scoped to it).
    # Override with TFPR_PLAN_ENVIRONMENT.
    environment: ${{ vars.TFPR_PLAN_ENVIRONMENT || 'plan' }}
    permissions:
      contents: read
      id-token: write        # Azure OIDC login
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.resolve.outputs.projects) }}
    # Share the PR-ops per-unit concurrency group so a drift plan and a PR
    # plan/apply for the same unit never contend for the state lock.
    concurrency:
      group: tfpr-${{ matrix.project.label }}
      cancel-in-progress: false
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      BACKEND_AZURE_RESOURCE_GROUP_NAME: ${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}
      BACKEND_AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}
      BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME: ${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}
    steps:
      # Scheduled runs check out the default branch: drift is main vs the tenant.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Reusable mode: install the runtime published with the release that
      # holds this workflow file (job.workflow_ref), from the public
      # entrypoint repo; no token, no private checkout. Vendored mode (the
      # engine repository itself) builds tfpr from its own checkout.
      - name: Install the engine runtime
        if: job.workflow_repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TFPR_RUNTIME_REPO: ${{ job.workflow_repository }}
          TFPR_RUNTIME_REF: ${{ job.workflow_ref }}
          TFPR_RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/install-runtime.sh" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$TFPR_RUNTIME_REPO/contents/install-runtime.sh?ref=$TFPR_RUNTIME_SHA"
          bash "$RUNNER_TEMP/install-runtime.sh"

      - name: Set up Go
        if: job.workflow_repository == github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tfpr
        if: job.workflow_repository == github.repository
        run: |
          go build -o "$RUNNER_TEMP/tfpr" ./cmd/tfpr
          echo "TFPR_BIN=$RUNNER_TEMP/tfpr" >>"$GITHUB_ENV"
          echo "TFPR_ENGINE_DIR=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # setup-tools' local action path cannot take an expression, so vendored and
      # reusable modes are two mutually exclusive steps (engine at ./ vs .tfpr-engine).
      - name: Setup tools
        if: job.workflow_repository == github.repository
        uses: ./.github/actions/setup-tools
        with:
          tools: ${{ matrix.project.tool == 'terragrunt' && 'terraform terragrunt' || 'terraform' }}
          terraform_version: ${{ env.FALLBACK_TERRAFORM_VERSION }}
          terragrunt_version: ${{ env.FALLBACK_TERRAGRUNT_VERSION }}
          extra_tools: ${{ vars.TFPR_EXTRA_TOOLS }}

      - name: Setup tools (reusable)
        if: job.workflow_repository != github.repository
        uses: ./.tfpr-engine/.github/actions/setup-tools
        with:
          tools: ${{ matrix.project.tool == 'terragrunt' && 'terraform terragrunt' || 'terraform' }}
          terraform_version: ${{ env.FALLBACK_TERRAFORM_VERSION }}
          terragrunt_version: ${{ env.FALLBACK_TERRAGRUNT_VERSION }}
          extra_tools: ${{ vars.TFPR_EXTRA_TOOLS }}

      # A non-empty plan is drift; tfpr run-project emits status
      # no-changes | changes | error. Never fail the job on drift: `changes` is
      # the expected drift signal and the schedule should stay green (the issue
      # is the signal). A genuine plan failure surfaces as status=error, which
      # the report job raises as an issue too.
      # Providers across runs and, in the apply walk, across units: Terraform's
      # plugin cache, keyed on the lock files. A unit is served from it only
      # when its lock file carries the h1 hash for this platform (terraform
      # providers lock -platform=linux_amd64); otherwise Terraform downloads
      # from the registry and fills the cache for next time (#188).
      # A path that is the same on every runner instance: actions/cache hashes
      # the path into the cache version, and runner.temp carries the instance
      # name on ephemeral self-hosted runners, so a cache saved there was
      # never found again (#284).
      - name: Provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tfpr-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            tfpr-providers-${{ runner.os }}-${{ runner.arch }}-

      # Never fatal: without the file the check reports no list, and the
      # gate and the drift report must still complete.
      - name: Receive the revocation list
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfpr-license
          path: ${{ runner.temp }}/tfpr-license-handover

      # Verify and report the license with the list resolve loaded (#350).
      - name: License check
        env:
          TFPR_LICENSE: ${{ vars.TFPR_LICENSE }}
          TFPR_ENTITLEMENT: ${{ vars.TFPR_ENTITLEMENT }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          TFPR_LICENSE_LIST_FILE: ${{ runner.temp }}/tfpr-license-handover/revocations.jws
          TFPR_LICENSE_LIST_SOURCE: ${{ needs.resolve.outputs.license_list_source || 'none' }}
        run: '"$TFPR_BIN" license check'

      - name: Plan (drift check)
        id: tf
        continue-on-error: true
        env:
          COMMAND: plan
          # This report is embedded in an issue, not a PR comment. Suppresses the
          # /apply instructions, which never run there.
          TFPR_REPORT_CONTEXT: drift
          PROJECT_NAME: ${{ matrix.project.name }}
          PROJECT_DIR: ${{ matrix.project.dir }}
          PROJECT_LABEL: ${{ matrix.project.label }}
          PROJECT_TOOL: ${{ matrix.project.tool }}
          REPORT_FILE: ${{ github.workspace }}/.tfpr/${{ matrix.project.label }}.md
          CHECK_TEXT_FILE: ${{ github.workspace }}/.tfpr/${{ matrix.project.label }}.check.md
          TFPR_TRIGGER_EVENT: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          TFPR_TRIGGER_ACTOR: ${{ github.event_name != 'schedule' && github.actor || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS_JSON: ${{ toJson(matrix.project.steps) }}
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          INIT_ARGS: ${{ vars.TFPR_INIT_ARGS }}
        run: TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache" "$TFPR_BIN" run-project

      # Stage this unit's result (status + report) for the report job. The report
      # job runs on a hosted runner and never touches state, so only the outcome
      # crosses the job boundary, not the plan environment.
      - name: Stage drift result
        if: always()
        env:
          LABEL: ${{ matrix.project.label }}
          STATUS: ${{ steps.tf.outputs.status }}
          SUMMARY: ${{ steps.tf.outputs.summary }}
          REPORT_FILE: ${{ github.workspace }}/.tfpr/${{ matrix.project.label }}.md
          CHECK_TEXT_FILE: ${{ github.workspace }}/.tfpr/${{ matrix.project.label }}.check.md
        run: |
          set -euo pipefail
          mkdir -p drift
          key="${LABEL//\//__}"
          jq -n --arg label "$LABEL" --arg status "${STATUS:-error}" --arg summary "$SUMMARY" \
            '{label: $label, status: $status, summary: $summary}' > "drift/${key}.json"
          [ -f "$REPORT_FILE" ] && cp "$REPORT_FILE" "drift/${key}.md" || true
          [ -f "$CHECK_TEXT_FILE" ] && cp "$CHECK_TEXT_FILE" "drift/${key}.check.md" || true

      - name: Upload drift result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-${{ strategy.job-index }}
          path: drift/*
          retention-days: 1

  report:
    name: report drift
    needs: [resolve, drift-plan]
    if: always() && needs.resolve.outputs.count != '0'
    # GitHub API only; no Azure, no state. Hosted runner with gh available.
    runs-on: ubuntu-latest
    # For the checks App key, which only default-branch runs can read (#348).
    environment: ${{ vars.TFPR_PLAN_ENVIRONMENT || 'plan' }}
    permissions:
      contents: read
      issues: write
    steps:
      # Reusable mode: install the runtime published with the release that
      # holds this workflow file (job.workflow_ref), from the public
      # entrypoint repo; no token, no private checkout. Vendored mode (the
      # engine repository itself) builds tfpr from its own checkout.
      - name: Install the engine runtime
        if: job.workflow_repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TFPR_RUNTIME_REPO: ${{ job.workflow_repository }}
          TFPR_RUNTIME_REF: ${{ job.workflow_ref }}
          TFPR_RUNTIME_SHA: ${{ job.workflow_sha }}
        run: |
          curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$RUNNER_TEMP/install-runtime.sh" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$TFPR_RUNTIME_REPO/contents/install-runtime.sh?ref=$TFPR_RUNTIME_SHA"
          bash "$RUNNER_TEMP/install-runtime.sh"

      - name: Checkout (vendored mode)
        if: job.workflow_repository == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: job.workflow_repository == github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tfpr
        if: job.workflow_repository == github.repository
        run: |
          go build -o "$RUNNER_TEMP/tfpr" ./cmd/tfpr
          echo "TFPR_BIN=$RUNNER_TEMP/tfpr" >>"$GITHUB_ENV"
          echo "TFPR_ENGINE_DIR=$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      # Never fatal: without the file the check reports no list, and the
      # gate and the drift report must still complete.
      - name: Receive the revocation list
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfpr-license
          path: ${{ runner.temp }}/tfpr-license-handover

      # Verify and report the license with the list resolve loaded (#350).
      - name: License check
        env:
          TFPR_LICENSE: ${{ vars.TFPR_LICENSE }}
          TFPR_ENTITLEMENT: ${{ vars.TFPR_ENTITLEMENT }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          TFPR_LICENSE_LIST_FILE: ${{ runner.temp }}/tfpr-license-handover/revocations.jws
          TFPR_LICENSE_LIST_SOURCE: ${{ needs.resolve.outputs.license_list_source || 'none' }}
        run: '"$TFPR_BIN" license check'

      - name: Download drift results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: drift-*
          path: drift
          merge-multiple: true

      - name: Open, refresh, and close drift issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRIFT_DIR: drift
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$TFPR_BIN" report-drift-issue'

      # One check run per unit on the default branch commit that was swept,
      # carrying the run summary a PR check carries. Only through the checks
      # App: the workflow token would need checks: write from every drift
      # caller, and without the App the issues remain the whole report.
      - name: Checks app token
        id: checks_token
        if: always() && vars.TFPR_CHECKS_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TFPR_CHECKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.TFPR_CHECKS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Post drift check runs
        if: always() && steps.checks_token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          DRIFT_DIR: drift
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: '"$TFPR_BIN" checks drift'

      - name: Note missing checks app
        if: always() && vars.TFPR_CHECKS_APP_CLIENT_ID == ''
        run: echo "::notice::TFPR_CHECKS_APP_CLIENT_ID is not set, so no drift check runs were posted. The drift issues carry the full report."
