# Review caller for tfpr. Copy to a consumer repo as
# .github/workflows/tfpr-review.yml, next to tfpr-pr.yml.
#
# A submitted or dismissed review starts no plan, so without this file the
# "tfpr / approval" row keeps the verdict of the last run until the
# next push or comment (#431). The dispatch action only dispatches a review
# refresh, so no credentials are needed here. Its own workflow, like the
# unlock caller, so a review adds no skipped rows to the PR (#206).
# Named like the PR caller so the row reads "tfpr / review", like every other row.
name: tfpr

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  actions: write         # dispatch the ops workflow

jobs:
  review:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    steps:
      - uses: nrit-solutions/tfpr/.github/actions/dispatch@v12.1.0 # x-release-please-version
