# Unlock caller for tfpr. Copy to a consumer repo as
# .github/workflows/tfpr-unlock.yml, next to tfpr-pr.yml.
#
# Releases the PR's cross-PR unit locks when it closes. Its own workflow so
# a merged PR's checks list shows one row that reads as lock release, instead
# of a skipped pre-commit row and a second dispatch row stacked on the last
# real run (#206). The dispatch action only dispatches the unlock, so no
# credentials are needed here.
name: tfpr unlock

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  actions: write         # dispatch the ops workflow

jobs:
  unlock:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    steps:
      - uses: nrit-solutions/tfpr/.github/actions/dispatch@v12.0.0 # x-release-please-version
