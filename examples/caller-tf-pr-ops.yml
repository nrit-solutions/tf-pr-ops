# Ops caller for tf-pr-ops: comment commands and dispatched work. Copy to a
# consumer repo as .github/workflows/tf-pr-ops.yml, next to tf-pr-ops-pr.yml
# (the PR caller) and drift.yml. This file is stable: engine changes never
# need a caller edit. Bump the two version pins (the uses: ref and
# engine_ref) together to move to a new engine release.
name: tf-pr-ops ops

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [plan, apply, unlock]
        default: plan
      project:
        required: false
      pr_number:
        required: false
      # Set by the PR caller's dispatch action on a push. Hints for wording
      # only; the engine resolves everything it decides from the API.
      before_sha:
        required: false
      trigger_actor:
        required: false

# The caller grants the ceiling of permissions the reusable workflow's jobs use.
permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  engine:
    uses: nrit-solutions/tf-pr-ops/.github/workflows/terraform-pr-ops.yml@v8.0.1 # x-release-please-version
    with:
      command: ${{ inputs.command || 'plan' }}
      project: ${{ inputs.project || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
      before_sha: ${{ inputs.before_sha || '' }}
      trigger_actor: ${{ inputs.trigger_actor || '' }}
      engine_ref: v8.0.1 # must match the uses: ref above; x-release-please-version
    # Pass the secrets by name. GitHub drops secrets: inherit when the caller
    # is in another organization than the reusable workflow.
    secrets:
      ENGINE_APP_PRIVATE_KEY: ${{ secrets.ENGINE_APP_PRIVATE_KEY }}
      TFPR_CHECKS_APP_PRIVATE_KEY: ${{ secrets.TFPR_CHECKS_APP_PRIVATE_KEY }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
