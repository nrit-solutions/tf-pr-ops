# Ops caller for tf-pr-ops: comment commands and dispatched work. Copy to a
# consumer repo as .github/workflows/tf-pr-ops.yml, next to tf-pr-ops-pr.yml
# (the PR caller) and drift.yml. This file is stable: engine changes never
# need a caller edit. Bump the two version pins (the uses: ref and
# engine_ref) together to move to a new engine release.
name: tf-pr-ops ops

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [plan, apply, unlock]
        default: plan
      project:
        required: false
      # Set by the engine when the PR caller's dispatch action hands work to
      # this workflow; never set them by hand.
      pr_number:
        required: false
      head_sha:
        required: false
      dispatch_run_id:
        required: false
      dispatch_run_number:
        required: false
      context:
        required: false

# The caller grants the ceiling of permissions the reusable workflow's jobs use.
permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  engine:
    uses: nrit-solutions/tf-pr-ops/.github/workflows/terraform-pr-ops.yml@v6.0.1 # x-release-please-version
    with:
      command: ${{ inputs.command || 'plan' }}
      project: ${{ inputs.project || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
      head_sha: ${{ inputs.head_sha || '' }}
      dispatch_run_id: ${{ inputs.dispatch_run_id || '' }}
      dispatch_run_number: ${{ inputs.dispatch_run_number || '' }}
      context: ${{ inputs.context || '' }}
      engine_ref: v6.0.1 # must match the uses: ref above; x-release-please-version
    secrets: inherit
