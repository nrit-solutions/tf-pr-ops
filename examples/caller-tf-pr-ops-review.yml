# Review caller for tf-pr-ops. Copy to a consumer repo as
# .github/workflows/tf-pr-ops-review.yml, next to tf-pr-ops-pr.yml.
#
# A submitted or dismissed review starts no plan, so without this file the
# "tf-pr-ops / approval" row keeps the verdict of the last run until the
# next push or comment (#431). The dispatch action only dispatches a review
# refresh, so no credentials are needed here. Its own workflow, like the
# unlock caller, so a review adds no skipped rows to the PR (#206).
name: tf-pr-ops review

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  actions: write         # dispatch the ops workflow

jobs:
  refresh:
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    steps:
      - uses: nrit-solutions/tf-pr-ops/.github/actions/dispatch@v11.0.0 # x-release-please-version
